---
# ============================================================
# OAM Patch Playbook
# ============================================================
# Usage:
#   Patch all OAM hosts (default):
#     ansible-playbook -i inventory/dev/hosts playbooks/patch_oam.yml
#
#   Patch specific location:
#     ansible-playbook -i inventory/dev/hosts playbooks/patch_oam.yml -e "target=oam_ap1"
#     ansible-playbook -i inventory/dev/hosts playbooks/patch_oam.yml -e "target=oam_ap2"
#
#   Patch specific server:
#     ansible-playbook -i inventory/dev/hosts playbooks/patch_oam.yml -e "target=oam1.ap1.dev.ccn2.taxud"
#
#   Patch on FAT environment:
#     ansible-playbook -i inventory/fat/hosts playbooks/patch_oam.yml -e "target=oam_ap1"
#
#   Override serial (default: 2 hosts at a time):
#     ansible-playbook -i inventory/dev/hosts playbooks/patch_oam.yml -e "serial=1"
#
# Default: runs on ALL OAM hosts (ap1 + ap2), 2 hosts at a time
# ============================================================

- name: OAM Patching
  hosts: "{{ target | default('oam') }}"
  serial: "{{ serial | default(2) }}"
  become: yes
  become_user: "{{ oracle_user }}"
  vars_files:
    - ../group_vars/vars.yml

  tasks:
    - name: Stop OAM services
      include_tasks: ../roles/stop_cots/stop_oam/tasks/stop_oam.yml
      tags: [stop, cots]

    - name: Backup OAM
      include_tasks: ../roles/backup/backup_oam/tasks/backup_oam.yml
      tags: [backup]

    - name: Install/Update JDK
      include_tasks: ../roles/jdk/tasks/jdk_install.yml
      tags: [jdk]

    - name: Replace Java cacerts for OAM
      include_tasks: ../roles/jdk/tasks/java_cacerts.yml
      when: java_cacerts_enabled | default(false) | bool
      tags: [jdk, cacerts]

    - name: Install/Update OPatch for OAM
      include_tasks: ../roles/opatch_install/tasks/opatch_install_oam.yml
      tags: [opatch]

    - name: Apply SPBAT OAM Bundle Patch
      include_tasks: ../roles/spbat/tasks/spbat_oam_install.yml
      tags: [spbat]

    - name: Apply OAM patches
      include_tasks: ../roles/patch/oam_patch_install/tasks/oam_install.yml
      tags: [patch]

    - name: Cleanup inactive OAM patches
      include_tasks: ../roles/opatch_cleanup/tasks/delete_inactive_patches.yml
      vars:
        oracle_home: "{{ oracle_home_oam }}"
        opatch_home: "{{ opatch_home_oam }}"
      tags: [patch_cleanup]

    - name: Clean OAM node1 managed server tmp and cache
      shell: >-
        if [ -d "{{ oam_managed_server_domain }}/servers/{{ item.0 }}/{{ item.1 }}" ]; then
          find "{{ oam_managed_server_domain }}/servers/{{ item.0 }}/{{ item.1 }}" -mindepth 1 -delete;
        fi
      loop: "{{ (oam_managed_servers_node1 | map(attribute='managed_server_node1') | list) | product(['tmp', 'cache']) | list }}"
      loop_control:
        label: "{{ oam_managed_server_domain }}/servers/{{ item.0 }}/{{ item.1 }}"
      when: inventory_hostname == 'oam1.' + ap + '.' + env + '.ccn2.taxud'
      tags: [cleanup]

    - name: Clean OAM node2 managed server tmp and cache
      shell: >-
        if [ -d "{{ oam_managed_server_domain }}/servers/{{ item.0 }}/{{ item.1 }}" ]; then
          find "{{ oam_managed_server_domain }}/servers/{{ item.0 }}/{{ item.1 }}" -mindepth 1 -delete;
        fi
      loop: "{{ (oam_managed_servers_node2 | map(attribute='managed_server_node2') | list) | product(['tmp', 'cache']) | list }}"
      loop_control:
        label: "{{ oam_managed_server_domain }}/servers/{{ item.0 }}/{{ item.1 }}"
      when: inventory_hostname == 'oam2.' + ap + '.' + env + '.ccn2.taxud'
      tags: [cleanup]

    - name: Clean OAM AdminServer tmp and cache on node1
      shell: >-
        if [ -d "{{ oam_admin_server_domain }}/servers/AdminServer/{{ item }}" ]; then
          find "{{ oam_admin_server_domain }}/servers/AdminServer/{{ item }}" -mindepth 1 -delete;
        fi
      loop:
        - tmp
        - cache
      loop_control:
        label: "{{ oam_admin_server_domain }}/servers/AdminServer/{{ item }}"
      when: inventory_hostname == 'oam1.' + ap + '.' + env + '.ccn2.taxud'
      tags: [cleanup]

    - name: Cleanup OAM binaries directory
      include_tasks: ../roles/binaries_cleanup/tasks/main.yml
      vars:
        patch_product: oam
        patch_backup_dir: "{{ backup_dir_oam }}"
        archive_spbat_logs: true
      tags: [binaries_cleanup]

    - name: Start OAM services
      include_tasks: ../roles/start_cots/start_oam/tasks/start_oam.yml
      tags: [start, cots]
