---
# ============================================================
# OIG Patch Playbook
# ============================================================
# Usage:
#   Patch all OIG hosts (default):
#     ansible-playbook -i inventory/dev/hosts playbooks/patch_oig.yml
#
#   Patch specific location:
#     ansible-playbook -i inventory/dev/hosts playbooks/patch_oig.yml -e "target=oig_mh"
#
#   Patch specific server:
#     ansible-playbook -i inventory/dev/hosts playbooks/patch_oig.yml -e "target=oim1.mh.dev.ccn2.taxud"
#
#   Patch on FAT environment:
#     ansible-playbook -i inventory/fat/hosts playbooks/patch_oig.yml -e "target=oig_mh"
#
#   Override serial (default: 2 hosts at a time):
#     ansible-playbook -i inventory/dev/hosts playbooks/patch_oig.yml -e "serial=1"
#
# Default: runs on ALL OIG hosts, 2 hosts at a time
# ============================================================

- name: OIG Patching
  hosts: "{{ target | default('oig') }}"
  serial: "{{ serial | default(2) }}"
  become: yes
  become_user: "{{ oracle_user }}"
  vars_files:
    - ../group_vars/vars.yml

  tasks:
    - name: Stop OIG services
      include_tasks: ../roles/stop_cots/stop_oig/tasks/stop_oig.yml
      tags: [stop, cots]

    - name: Backup OIG
      include_tasks: ../roles/backup/backup_oig/tasks/backup_oig.yml
      tags: [backup]

    - name: Install/Update JDK
      include_tasks: ../roles/jdk/tasks/jdk_install.yml
      vars:
        backup_dir_jdk: "{{ backup_dir_oig }}"
      tags: [jdk]

    - name: Replace Java cacerts for OIG
      include_tasks: ../roles/jdk/tasks/java_cacerts.yml
      when: java_cacerts_enabled | default(false) | bool
      tags: [jdk, cacerts]

    - name: Install/Update OPatch for OIG
      include_tasks: ../roles/opatch_install/tasks/opatch_install_oig.yml
      tags: [opatch]

    - name: Apply SPBAT OIG Bundle Patch
      include_tasks: ../roles/spbat/tasks/spbat_oig_install.yml
      tags: [spbat]

    - name: Apply OIG patches
      include_tasks: ../roles/patch/oig_patch_install/tasks/oig_install.yml
      tags: [patch]

    - name: Cleanup inactive OIG patches
      include_tasks: ../roles/opatch_cleanup/tasks/delete_inactive_patches.yml
      vars:
        oracle_home: "{{ oracle_home_oig }}"
        opatch_home: "{{ opatch_home_oig }}"
      tags: [patch_cleanup]

    - name: Clean OIG node1 managed server tmp and cache
      shell: >-
        if [ -d "{{ oig_managed_server_domain }}/servers/{{ item.0 }}/{{ item.1 }}" ]; then
          find "{{ oig_managed_server_domain }}/servers/{{ item.0 }}/{{ item.1 }}" -mindepth 1 -delete;
        fi
      loop: "{{ (oig_managed_servers_node1 | map(attribute='managed_server_node1') | list) | product(['tmp', 'cache']) | list }}"
      loop_control:
        label: "{{ oig_managed_server_domain }}/servers/{{ item.0 }}/{{ item.1 }}"
      when: inventory_hostname is match('^oim1\\.')
      tags: [cleanup]

    - name: Clean OIG node2 managed server tmp and cache
      shell: >-
        if [ -d "{{ oig_managed_server_domain }}/servers/{{ item.0 }}/{{ item.1 }}" ]; then
          find "{{ oig_managed_server_domain }}/servers/{{ item.0 }}/{{ item.1 }}" -mindepth 1 -delete;
        fi
      loop: "{{ (oig_managed_servers_node2 | map(attribute='managed_server_node2') | list) | product(['tmp', 'cache']) | list }}"
      loop_control:
        label: "{{ oig_managed_server_domain }}/servers/{{ item.0 }}/{{ item.1 }}"
      when: inventory_hostname is match('^oim2\\.')
      tags: [cleanup]

    - name: Clean OIG AdminServer tmp and cache on node1
      shell: >-
        if [ -d "{{ oig_admin_server_domain }}/servers/AdminServer/{{ item }}" ]; then
          find "{{ oig_admin_server_domain }}/servers/AdminServer/{{ item }}" -mindepth 1 -delete;
        fi
      loop:
        - tmp
        - cache
      loop_control:
        label: "{{ oig_admin_server_domain }}/servers/AdminServer/{{ item }}"
      when: inventory_hostname is match('^oim1\\.')
      tags: [cleanup]

    - name: Start OIG services
      include_tasks: ../roles/start_cots/start_oig/tasks/start_oig.yml
      tags: [start, cots]
