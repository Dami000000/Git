---
- name: Create AAG backup directory if not present
  file:
    path: "{{ backup_dir_aag }}"
    state: directory

- name: Create AAG backup installation home
  archive:
    path: "{{ aag_install_dir }}"
    dest: "{{ backup_dir_aag }}/Axway-7.7.0_{{ ansible_date_time.date }}_full_backup.tar.gz"
    format: gz
