---
- name: Create OAM backup directory if not present
  file:
    path: "{{ backup_dir_oam }}"
    state: directory

- name: Create backup of OAM Managed Server configuration files - {{ oam_managed_server_domain }}
  shell:
    cmd: "tar czf {{ backup_dir_oam }}/OAM_config_{{ ansible_date_time.date }}_full_backup.tar.gz {{ oam_managed_server_domain }}"

- name: Create backup of OAM Managed Server binaries - {{ oracle_home_oam }}
  shell:
    cmd: "tar czf {{ backup_dir_oam }}/fmwOAM12214_{{ ansible_date_time.date }}_full_backup.tar.gz {{ oracle_home_oam }}"

- name: Create backup of OAM Admin Server configuration files - {{ oam_admin_server_domain }}
  shell:
    cmd: "tar czf {{ backup_dir_oam }}/Admin_OAM_config_{{ ansible_date_time.date }}_full_backup.tar.gz {{ oam_admin_server_domain }}"
  async: 3600
  poll: 30
  when:
    - inventory_hostname == 'oam1.' + ap + '.' + env + '.ccn2.taxud'
