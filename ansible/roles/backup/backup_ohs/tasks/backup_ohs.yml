---
- name: Create OHS backup directory if not present
  file:
    path: "{{ backup_dir_ohs }}"
    state: directory

- name: Create backup of OHS configuration files - {{ ohs_config_dir }}
  archive:
    path: "{{ ohs_config_dir }}"
    dest: "{{ backup_dir_ohs }}/OHS_config_{{ ansible_date_time.date }}_full_backup.tar.gz"
    format: gz

- name: Create backup of OHS Oracle Home - {{ oracle_home_ohs }}
  archive:
    path: "{{ oracle_home_ohs }}"
    dest: "{{ backup_dir_ohs }}/fmwOHS12214_{{ ansible_date_time.date }}_full_backup.tar.gz"
    format: gz
