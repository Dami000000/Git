---
- name: Create OIG backup directory if not present
  file:
    path: "{{ backup_dir_oig }}"
    state: directory

- name: Create backup of OIG Managed Server configuration files - {{ oig_managed_server_domain }}
  shell:
    cmd: "tar czf {{ backup_dir_oig }}/OIG_config_{{ ansible_date_time.date }}_full_backup.tar.gz {{ oig_managed_server_domain }}"
    warn: false

- name: Create backup of OIG Managed Server binaries - {{ oracle_home_oig }}
  shell:
    cmd: "tar czf {{ backup_dir_oig }}/fmwOIM12214_{{ ansible_date_time.date }}_full_backup.tar.gz {{ oracle_home_oig }}"
    warn: false

- name: Create backup of OIG Admin Server configuration files - {{ oig_admin_server_domain }}
  shell:
    cmd: "tar czf {{ backup_dir_oig }}/Admin_OIG_config_{{ ansible_date_time.date }}_full_backup.tar.gz {{ oig_admin_server_domain }}"
    warn: false
  when:
    - inventory_hostname == 'oim1.' + ap + '.' + env + '.ccn2.taxud'
