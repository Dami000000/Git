---
- name: Create OSB backup directory if not present
  file:
    path: "{{ backup_dir_osb }}"
    state: directory

- name: Create backup of OSB Domain - {{ osb_domain }}
  archive:
    path: "{{ osb_domain }}"
    dest: "{{ backup_dir_osb }}/OSB_domain_{{ ansible_date_time.date }}_full_backup.tar.gz"
    format: gz

- name: Create backup of OSB binaries - {{ oracle_home_osb }}
  archive:
    path: "{{ oracle_home_osb }}"
    dest: "{{ backup_dir_osb }}/fmwOSB12214_{{ ansible_date_time.date }}_full_backup.tar.gz"
    format: gz
