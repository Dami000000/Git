---
- name: Create OUD backup directory if not present
  file:
    path: "{{ backup_dir_oud }}"
    state: directory

- name: Create backup of OUD LDAP instance
  archive:
    path: "{{ oud_ldap_instance }}"
    dest: "{{ backup_dir_oud }}/ldap_instance_{{ ansible_date_time.date }}_full_backup.tar.gz"
    format: gz

- name: Create backup of OUD Oracle Home - {{ oracle_home_oud }}
  archive:
    path: "{{ oracle_home_oud }}"
    dest: "{{ backup_dir_oud }}/fmwOUD12214_{{ ansible_date_time.date }}_full_backup.tar.gz"
    format: gz
