---
- name: Check current Java version before upgrade
  shell:
    cmd: "{{ java_home }}/bin/java -version 2>&1 | awk -F '\"' '/version/ {print \"jdk\" $2}'"
  register: current_java_version
  ignore_errors: yes

- name: Display current Java version
  debug:
    msg: "Current Java version: {{ current_java_version.stdout }}"

- name: Ensure product JDK backup directory exists
  file:
    path: "{{ backup_dir_jdk }}"
    state: directory
    owner: "{{ oracle_user }}"
    group: "{{ oracle_group }}"
    mode: '0755'

- name: Create compressed backup of current JDK
  command:
    cmd: >-
      tar -czf {{ backup_dir_jdk }}/{{ current_java_version.stdout }}_{{ ansible_date_time.iso8601_basic_short }}_backup.tar.gz
      -C {{ java_home | dirname }} {{ java_home | basename }}
  when: current_java_version.stdout != ""

- name: Remove old JDK from /app after successful backup
  file:
    path: "{{ java_home }}"
    state: absent
  when: current_java_version.stdout != ""

- name: Upload Java {{ jdk_archive }}
  copy:
    src: "{{ patches_dir_java }}/{{ jdk_archive }}"
    dest: "{{ binaries_dir }}/{{ jdk_archive }}"

- name: Unzip Java
  unarchive:
    src: "{{ binaries_dir }}/{{ jdk_archive }}"
    dest: /app
    remote_src: yes

- name: Move new JDK to java_home
  command:
    cmd: "mv /app/{{ new_jdk }} {{ java_home }}"

- name: Check new Java version after upgrade
  shell:
    cmd: "{{ java_home }}/bin/java -version 2>&1 | awk -F '\"' '/version/ {print \"jdk\" $2}'"
  register: java_version_after

- name: Display new Java version
  debug:
    msg: "New Java version: {{ java_version_after.stdout }}"

- name: Stop playbook when new Java version is incorrect
  fail:
    msg: "Expected {{ new_jdk }} but found {{ java_version_after.stdout }}. Playbook stopped."
  when: java_version_after.stdout != new_jdk
